name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release again, for example v0.1.0
        required: true
        type: string

permissions: {}

defaults:
  run:
    working-directory: cli

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - {
              runner: macos-latest,
              os: darwin,
              arch: arm64,
              target: bun-darwin-arm64,
            }
          - {
              runner: macos-latest,
              os: darwin,
              arch: x64,
              target: bun-darwin-x64-baseline,
              exec: arch -x86_64,
            }
          - {
              runner: ubuntu-latest,
              os: linux,
              arch: x64,
              target: bun-linux-x64-baseline,
            }
          - {
              runner: ubuntu-24.04-arm,
              os: linux,
              arch: arm64,
              target: bun-linux-arm64,
            }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
        working-directory: .

      - name: Build and pack
        run: |
          bun build --compile --minify --no-compile-autoload-dotenv --no-compile-autoload-bunfig \
            --target="${{ matrix.target }}" src/index.ts --outfile dist/ski
          tar czf "dist/ski-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" -C dist ski

      - name: Smoke test the binary
        env:
          EXEC: ${{ matrix.exec }}
          PLATFORM: ${{ matrix.os }}-${{ matrix.arch }}
        run: |
          ski="$PWD/dist/ski"
          $EXEC "$ski" --version | grep -F "ski/${TAG#v} $PLATFORM"

          work="$RUNNER_TEMP/smoke"
          mkdir -p "$work/source/skills/hello" "$work/project"
          printf -- '---\nname: hello\ndescription: Smoke test skill.\n---\n# hello\n' > "$work/source/skills/hello/SKILL.md"
          cd "$work/project" && git init -q
          $EXEC "$ski" add ../source hello -p --agent claude --yes
          rm -rf .claude .ski
          $EXEC "$ski" install --agent claude --yes
          test -L .claude/skills/hello
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ski-${{ matrix.os }}-${{ matrix.arch }}
          path: cli/dist/ski-*.tar.gz
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun run test

      - name: Check that package.json matches the tag
        run: |
          version=$(bun -p 'require("./package.json").version')
          if [ "v$version" != "$TAG" ]; then
            echo "cli/package.json is $version, tag is $TAG" >&2
            exit 1
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ski-*
          path: cli/dist
          merge-multiple: true
      - name: Write checksums
        run: cd dist && shasum -a 256 ski-*.tar.gz > checksums.txt && cat checksums.txt

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.tar.gz dist/checksums.txt --clobber
          else
            args=(--generate-notes)
            case "$TAG" in *-*) args+=(--prerelease) ;; esac
            gh release create "$TAG" dist/*.tar.gz dist/checksums.txt "${args[@]}"
          fi

      # Last: the asset must be public before the formula points at it.
      - name: Update the Homebrew tap
        if: ${{ !contains(env.TAG, '-') }}
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          key="$RUNNER_TEMP/tap-deploy"
          printf '%s\n' "$TAP_DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

          tap="$RUNNER_TEMP/tap"
          git clone --depth 1 git@github.com:osrim/homebrew-tap.git "$tap"
          mkdir -p "$tap/Formula"
          bun scripts/brew-formula.ts "${TAG#v}" dist/checksums.txt > "$tap/Formula/ski.rb"

          cd "$tap"
          git add Formula/ski.rb
          if git diff --cached --quiet; then
            echo "Formula/ski.rb unchanged, nothing to push"
          else
            git -c user.name=github-actions[bot] \
                -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
                commit -m "ski $TAG"
            git push
          fi
